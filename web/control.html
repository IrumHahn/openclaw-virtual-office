<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>미션 컨트롤</title>
<meta name="description" content="관제탑 콘솔에 앉은 로봇 요원들. 텔레메트리 HUD, 미션 타임라인, 상태등으로 팀을 지휘한다.">
<link rel="stylesheet" href="engine.css">
<style>
@import url('https://fonts.googleapis.com/css2?family=Share+Tech+Mono&display=swap');
:root{--bg:#050912;--ink:#d7e6ff;--muted:#6f86b3;--cyan:#39d7ff;--amber:#ffb347;--red:#ff5c6c;--green:#49e3a0;--panel:rgba(8,16,34,.78);--line:rgba(57,215,255,.25)}
*{box-sizing:border-box}html,body{margin:0;background:var(--bg);color:var(--ink);font-family:"Share Tech Mono",ui-monospace,Menlo,monospace;letter-spacing:.3px}
.deck{position:relative;max-width:1600px;margin:0 auto;padding:12px}
.stage{aspect-ratio:1680/945;border-radius:10px;background:#000;--tag-bg:rgba(8,16,34,.86);--tag-ink:#d7e6ff;--tag-muted:#6f86b3;--tag-line:rgba(57,215,255,.45);--accent:#39d7ff;--fs:11px;box-shadow:0 0 0 1px var(--line),0 0 60px -10px rgba(57,215,255,.35)}
.stage .actor .nametag{border-radius:2px;font-family:inherit;text-transform:uppercase}
.stage .actor .nametag::after{display:none}
.stage .actor .nametag small{text-transform:none}
.stage .actor .bubble{border-radius:2px;font-family:inherit;background:var(--cyan);color:#021018}
.stage .actor .bubble.soft{background:rgba(8,16,34,.9);color:var(--ink);border:1px solid var(--line)}
.stage .actor .bubble.soft::after{border-top-color:rgba(8,16,34,.9)}
.stage .actor img.sprite{filter:drop-shadow(0 0 10px rgba(57,215,255,.25)) drop-shadow(0 6px 4px rgba(0,0,0,.5))}
.hud{position:absolute;pointer-events:none}
.panel{background:var(--panel);border:1px solid var(--line);border-radius:6px;padding:10px 12px;backdrop-filter:blur(6px);pointer-events:auto}
.panel h4{margin:0 0 6px;font-size:10px;color:var(--cyan);letter-spacing:2px}
.tl{left:20px;top:20px;width:300px}
.tl ul{list-style:none;margin:0;padding:0;font-size:11px;display:grid;gap:4px;max-height:160px;overflow:hidden}
.tl li{display:grid;grid-template-columns:44px 8px 1fr;gap:6px;align-items:center;color:var(--muted)}.tl li b{color:var(--ink);font-weight:400}
.tl li i{width:8px;height:8px;border-radius:50%;background:var(--muted)}.tl li.deliver i{background:var(--green)}.tl li.meet i{background:var(--amber)}.tl li.move i{background:var(--cyan)}
.kpi{right:20px;top:20px;display:flex;gap:10px}
.kpi .panel{min-width:110px;text-align:center}.kpi b{display:block;font-size:26px;color:var(--cyan);line-height:1}.kpi small{color:var(--muted);font-size:10px}
.kpi .panel.g b{color:var(--green)}.kpi .panel.a b{color:var(--amber)}
.status{left:20px;bottom:20px;width:360px}
.status ul{list-style:none;margin:0;padding:0;display:grid;grid-template-columns:1fr 1fr;gap:4px 12px;font-size:11px}
.status li{display:flex;align-items:center;gap:6px;color:var(--muted)}.status li b{color:var(--ink);font-weight:400}
.status .led{width:7px;height:7px;border-radius:50%;background:#394a6e;box-shadow:0 0 6px transparent}.status .led.on{background:var(--green);box-shadow:0 0 8px var(--green)}.status .led.move{background:var(--cyan);box-shadow:0 0 8px var(--cyan)}.status .led.warn{background:var(--amber);box-shadow:0 0 8px var(--amber)}
.title{position:absolute;left:50%;top:14px;transform:translateX(-50%);text-align:center;pointer-events:none}
.title b{font-size:13px;letter-spacing:4px;color:var(--cyan)}.title small{display:block;color:var(--muted);font-size:10px;letter-spacing:2px}
.ticker{position:absolute;right:20px;bottom:20px;width:420px}
.ticker .line{font-size:11px;color:var(--ink);white-space:nowrap;overflow:hidden}.ticker .line span{display:inline-block;animation:scroll 22s linear infinite;padding-left:100%}
@keyframes scroll{to{transform:translateX(-100%)}}
.ring{position:absolute;width:60px;height:60px;border:2px solid var(--cyan);border-radius:50%;transform:translate(-50%,-50%);pointer-events:none;animation:ring 1.2s ease-out forwards;z-index:900}
@keyframes ring{0%{transform:translate(-50%,-50%) scale(.2);opacity:1}100%{transform:translate(-50%,-50%) scale(1.6);opacity:0}}
.bar{display:flex;justify-content:space-between;align-items:center;padding:0 4px 10px;font-size:11px;color:var(--muted)}.bar a{color:var(--muted);text-decoration:none}
.bar b{color:var(--ink);font-weight:400}
.grain{position:absolute;inset:0;pointer-events:none;background:repeating-linear-gradient(0deg,rgba(255,255,255,.025) 0 1px,transparent 1px 3px);border-radius:10px}
</style>
</head>
<body>
<div class="deck">
  <div class="bar"><div><b>MISSION CONTROL</b> · 한이룸 AI OPS · <span id="utc"></span></div><a href="index.html">← 시안 목록</a></div>
  <div class="stage" id="stage"><img class="bg" src="bg/control.jpg" alt="" draggable="false"><div class="grain"></div><div id="actors"></div>
    <div class="title"><b>OPS FLOOR 01</b><small id="sub">10 AGENTS · ALL SYSTEMS NOMINAL</small></div>
    <div class="hud tl panel"><h4>MISSION TIMELINE</h4><ul id="tl"></ul></div>
    <div class="hud kpi"><div class="panel"><b id="kActive">0</b><small>ACTIVE</small></div><div class="panel a"><b id="kMeet">0</b><small>SYNC</small></div><div class="panel g"><b id="kDone">0</b><small>DELIVERED</small></div></div>
    <div class="hud status panel"><h4>AGENT STATUS</h4><ul id="status"></ul></div>
    <div class="hud ticker panel"><h4>TELEMETRY</h4><div class="line"><span id="tick">LINK OK · GATEWAY VPS 100% · NODE PC CONNECTED · TOKENS 68% · QUEUE 3 · LAST SYNC 00:12</span></div></div>
  </div>
</div>
<script src="org.js"></script>
<script src="engine.js"></script>
<script src="maps-v3.js"></script>
<script>
(function(){
  const ORG = window.OFFICE_ORG, MAP = window.OFFICE_MAPS_V3.CONTROL
  const stage = document.getElementById('stage')
  const tl = document.getElementById('tl')
  const t = () => { const d = new Date(); return `${String(d.getHours()).padStart(2, '0')}:${String(d.getMinutes()).padStart(2, '0')}` }
  function addTl(text, kind) { const li = document.createElement('li'); li.className = kind; li.innerHTML = `<span>${t()}</span><i></i><b></b>`; li.querySelector('b').textContent = text; tl.prepend(li); while (tl.children.length > 7) tl.lastChild.remove() }
  function ring(actor) { const r = document.createElement('div'); r.className = 'ring'; r.style.left = `${actor.x}%`; r.style.top = `${actor.y - 6}%`; stage.appendChild(r); setTimeout(() => r.remove(), 1300) }
  const E = window.OfficeEngine.create({
    stage, actorsEl: document.getElementById('actors'), org: ORG, map: MAP, chars: 'chars/robot', spriteScale: 0.07, depth: [0.6, 1.2], walkSpeed: 18,
    lines: { coffee: ['REFUEL', '☕ 0.2L', 'ENERGY +10%'], approve: ['ACK ✓', 'APPROVED', 'GO FOR LAUNCH'], delivered: 'PAYLOAD DELIVERED', decided: 'DECISION LOCKED', board: ['BRIEFING', 'PLAN v2', 'RISK LOG'], meeting: ['T-minus 3 days', '초안은 내가', '검수 라인 확인', '목요일 발표 순서', 'OK, 확정'] },
    weights: [['type', 5], ['coffee', 1.5], ['deliver', 3], ['chat', 1.5], ['board', 1.5], ['meeting', 1.2]],
    on(ev, p) {
      if (ev === 'log') addTl(p.text, p.kind)
      if (ev === 'status') renderStatus()
      if (ev === 'done') { document.getElementById('kDone').textContent = p.count; ring(p.actor); document.getElementById('tick').textContent = `DELIVERED: ${p.task} · ${p.actor.a.name} · ` + document.getElementById('tick').textContent }
      if (ev === 'meeting') { document.getElementById('kMeet').textContent = Number(document.getElementById('kMeet').textContent) + 1; p.forEach(ring) }
    },
  })
  E.start()
  function renderStatus() {
    const ul = document.getElementById('status'); ul.innerHTML = ''
    let active = 0
    for (const a of E.actors) {
      const li = document.createElement('li'); const led = a.ghost ? '' : a.status === '작업 중' ? 'on' : a.status === '이동 중' ? 'move' : (a.status === '휴식' || a.status === '커피 ☕') ? 'warn' : 'on'
      if (!a.ghost && a.status === '작업 중') active += 1
      li.innerHTML = `<span class="led ${led}"></span><b></b><span></span>`; li.querySelector('b').textContent = a.ghost ? 'VACANT' : a.a.name; li.lastChild.textContent = a.ghost ? a.a.name.replace('채용 예정 · ', '') : a.status
      ul.appendChild(li)
    }
    document.getElementById('kActive').textContent = active
    document.getElementById('sub').textContent = `${E.actors.filter(a => !a.ghost).length} AGENTS · ${active >= 7 ? 'ALL SYSTEMS NOMINAL' : 'CREW ROTATING'}`
  }
  setInterval(() => { const d = new Date(); document.getElementById('utc').textContent = d.toISOString().slice(11, 19) + ' UTC' }, 1000)
  renderStatus()
})()
</script>
</body>
</html>
