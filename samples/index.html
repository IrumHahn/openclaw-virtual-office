<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>가상 오피스 시안</title>
<meta name="description" content="OpenClaw 에이전트 팀을 가상 오피스로 그리는 virtual-office 스킬의 옵션별 시안. 스타일 4종 × 성장 단계 3종.">
<style>
:root{--bg:#f5f3ee;--ink:#2a2622;--muted:#7a736a;--card:#fff;--line:#e4ded3;--accent:#d1803e}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#15181f;--ink:#eae7e1;--muted:#9a978f;--card:#1e222b;--line:#2d323d}}
:root[data-theme="dark"]{--bg:#15181f;--ink:#eae7e1;--muted:#9a978f;--card:#1e222b;--line:#2d323d}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font-family:system-ui,-apple-system,"Apple SD Gothic Neo","Malgun Gothic",sans-serif}
main{max-width:1240px;margin:0 auto;padding:28px 16px 48px}
h1{font-size:24px;margin:0 0 6px}p.lead{margin:0 0 18px;color:var(--muted);font-size:14px;line-height:1.6}
.controls{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-bottom:16px}
@media (max-width:720px){.controls{grid-template-columns:1fr}}
fieldset{border:1px solid var(--line);border-radius:12px;padding:10px 12px;background:var(--card);margin:0}
legend{font-size:12px;color:var(--muted);padding:0 6px}
.opts{display:flex;flex-wrap:wrap;gap:8px}
.opt{border:1px solid var(--line);border-radius:999px;padding:7px 12px;font-size:13px;cursor:pointer;background:transparent;color:var(--ink)}
.opt[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:#fff}
.opt small{display:block;font-size:11px;opacity:.75}
.stage{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:10px}
.meta{display:flex;flex-wrap:wrap;gap:8px 18px;font-size:13px;color:var(--muted);margin:12px 2px 0}
.meta b{color:var(--ink)}
.note{margin-top:18px;font-size:13px;color:var(--muted);line-height:1.6;border-top:1px solid var(--line);padding-top:12px}
.note code{background:var(--card);border:1px solid var(--line);border-radius:6px;padding:1px 6px;font-size:12px}
</style>
</head>
<body>
<main>
<h1>가상 오피스 시안</h1>
<p class="lead">샘플 조직: 이룸의 맥미니 OpenClaw 팀(직원 10명, 실제 에이전트 이름·역할). 채용 예정 포지션은 업무 지도에서 뽑는다는 가정의 <b>예시</b>예요. 스타일과 성장 단계를 눌러 보세요. 내 팀으로 만들려면 아래 안내대로 스킬을 설치하면 돼요.</p>
<div class="controls">
<fieldset><legend>스타일</legend><div class="opts" id="styles"></div></fieldset>
<fieldset><legend>성장 단계 (책상 수)</legend><div class="opts" id="stages"></div></fieldset>
</div>
<div class="stage" id="stage"></div>
<div class="meta" id="meta"></div>
<p class="note">이 화면은 스킬이 만드는 결과와 같은 렌더러로 그렸어요. 스킬 실행: 에이전트 채팅에 <code>가상 오피스 만들어줘</code> → 옵션 번호 고르기 → 대시보드 홈 「나의 위젯」에 도착. 빈 책상의 <b>채용 예정</b>은 내 업무 지도의 "맡기고 싶은 일"에서 나와요.</p>
</main>
<script type="module">
// 가상 오피스 렌더러 — 조직(org) + 옵션(style, stage) → 아이소메트릭 SVG.
// 순수 함수만 있다(Node 내장 모듈도 쓰지 않음). Node 스크립트와 브라우저 시안 페이지가 같이 쓴다.
// 외부 폰트·이미지·스크립트·URL 을 넣지 않는다: 대시보드 위젯 칸(sandbox, 외부 통신 차단)에서 그대로 열려야 한다.
// 용량을 줄이려고 책상·의자·사람·화분은 <symbol> 하나를 <use> 로 찍는다(아이소메트릭 투영은 평행이동이라 가능).

const STYLES = {
  warm: {
    label: '코지 베이지', desc: '따뜻한 나무 바닥과 베이지 벽. 작은 스튜디오 느낌',
    bg: '#f3eee4', floorA: '#e8dcc8', floorB: '#e1d3bc', wall: '#f8f4ed', wallSide: '#ece5d8', wallEdge: '#d6cab6',
    desk: '#eadfca', deskSide: '#cdbb9d', deskFront: '#dccbb0', monitor: '#4a4f57', screen: '#dfe8ec', chair: '#8b9097',
    accent: '#d1803e', tag: '#ffffff', tagLine: '#e4dacb', ink: '#3a342c', muted: '#8a8176', plant: '#6f9a5a', pot: '#c6714b',
    sofa: '#d9cfc2', rug: '#eee6d9', window: '#d7e7ef', windowFrame: '#d3c8b7', ghost: '#b9ad9c', skin: '#f6e3cf',
  },
  glass: {
    label: '화이트 아틀리에', desc: '통유리창과 화이트 가구, 식물 가득. 밝은 아틀리에',
    bg: '#ffffff', floorA: '#f2f5f8', floorB: '#e9eef3', wall: '#ffffff', wallSide: '#f3f6f9', wallEdge: '#d9e0e7',
    desk: '#ffffff', deskSide: '#d8dfe6', deskFront: '#eaeff4', monitor: '#3b434d', screen: '#dff1ff', chair: '#aab4bf',
    accent: '#3f8f6e', tag: '#ffffff', tagLine: '#dfe6ec', ink: '#22303a', muted: '#7d8a96', plant: '#4f9a63', pot: '#eef1f4',
    sofa: '#dbe8f3', rug: '#e6eef2', window: '#c9e4f7', windowFrame: '#e3e9ee', ghost: '#b7c2cc', skin: '#f6e3cf',
  },
  pixel: {
    label: '레트로 픽셀', desc: '체크무늬 바닥, 벽돌 벽, 8비트 소품. 게임 속 사무실',
    bg: '#f6e9c6', floorA: '#f5e6bf', floorB: '#e9d7a6', wall: '#c98c68', wallSide: '#b57a59', wallEdge: '#8e5a3c',
    desk: '#b0773f', deskSide: '#7f4f28', deskFront: '#99632f', monitor: '#2f2a2a', screen: '#9fe3c3', chair: '#6b4a3a',
    accent: '#e3a92a', tag: '#fff7dc', tagLine: '#8e5a3c', ink: '#2b2320', muted: '#7a6450', plant: '#4c9a4a', pot: '#b9552f',
    sofa: '#e8c9a0', rug: '#efd9b2', window: '#9fd3f0', windowFrame: '#6f4530', ghost: '#b89a76', skin: '#f3d9b8', crisp: true,
  },
  night: {
    label: '네온 관제실', desc: '어두운 바닥에 모니터 불빛. 밤새 돌아가는 관제실',
    bg: '#0b0f1a', floorA: '#161d2b', floorB: '#121826', wall: '#121827', wallSide: '#0d1220', wallEdge: '#26314a',
    desk: '#34425c', deskSide: '#1f2838', deskFront: '#2a3549', monitor: '#0b0f18', screen: '#5ef0c6', chair: '#3a4659',
    accent: '#5ef0c6', tag: '#1b2434', tagLine: '#2f3d55', ink: '#e8eef7', muted: '#93a1b7', plant: '#3f8f6e', pot: '#334155',
    sofa: '#2b3649', rug: '#1c2537', window: '#1e2b45', windowFrame: '#2f3d55', ghost: '#4a5873', skin: '#e9d2bd', glow: true,
  },
}

const STAGES = {
  studio: { label: '지금 (스튜디오)', desc: '책상 4개 · 지금 인원이 꽉 차 보이는 작은 사무실', cols: 10, rows: 9, pods: [[1.5, 1.5]], lounge: [7, 1], meeting: null, board: null, shelf: [0, 0.6], plants: [[9, 8], [0.5, 8], [9, 0.3]] },
  floor: { label: '6개월 뒤 (한 층)', desc: '책상 12개 · 빈 자리에 채용 예정 포지션이 보이는 한 층', cols: 16, rows: 11, pods: [[1.5, 1.5], [7.5, 1.5], [1.5, 6.5]], lounge: [12.5, 6.5], meeting: [8, 7.5], board: [12, 0], shelf: [0, 0.6], plants: [[15, 10], [6.5, 10], [15, 0.3], [0.5, 10]] },
  hq: { label: '2년 뒤 (본사)', desc: '책상 20개 · 부서 구역이 나뉜 본사 한 층', cols: 20, rows: 13, pods: [[1.5, 1.5], [7.5, 1.5], [13.5, 1.5], [1.5, 7], [7.5, 7]], lounge: [16.5, 8.5], meeting: [13.5, 7.5], board: [16, 0], shelf: [0, 0.6], plants: [[19, 12], [12, 12], [19, 0.3], [0.5, 12], [19, 5]] },
}

const FONT = 'system-ui, -apple-system, "Apple SD Gothic Neo", "Malgun Gothic", sans-serif'
const TW = 40 // 타일 반폭
const TH = 20 // 타일 반높이
const WALL_H = 120
const DESK_H = 20

function esc(value) {
  return String(value ?? '').replace(/[&<>"']/g, ch => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[ch]))
}
function r(n) { return Math.round(n) }
function cut(text, max) { const s = String(text ?? ''); return s.length > max ? `${s.slice(0, max - 1)}…` : s }

function normalizeOrg(input) {
  const org = input && typeof input === 'object' ? input : {}
  const agents = (Array.isArray(org.agents) ? org.agents : []).map((a, i) => ({
    id: String(a.id || `a${i}`).slice(0, 40),
    name: cut(a.name || a.id || `직원 ${i + 1}`, 14),
    emoji: cut(a.emoji || '🤖', 4),
    role: cut(a.role || '', 16),
    coordinator: a.coordinator === true,
    status: ['working', 'idle', 'break'].includes(a.status) ? a.status : 'idle',
    level: Number.isInteger(a.level) && a.level > 0 ? Math.min(a.level, 99) : 1,
    bubble: cut(a.bubble || '', 18),
  }))
  if (agents.length && !agents.some(a => a.coordinator)) agents[0].coordinator = true
  const planned = (Array.isArray(org.planned) ? org.planned : []).map((p, i) => ({
    title: cut(typeof p === 'string' ? p : p.title || `포지션 ${i + 1}`, 14),
    reason: cut(typeof p === 'string' ? '' : p.reason || '', 24),
    emoji: cut(typeof p === 'string' ? '✨' : p.emoji || '✨', 4),
  }))
  return {
    company: cut(org.company || '내 AI 오피스', 24),
    owner: cut(org.owner || '', 14),
    tagline: cut(org.tagline || '', 40),
    departments: (Array.isArray(org.departments) ? org.departments : []).map(d => cut(d, 12)).slice(0, 5),
    agents,
    planned,
  }
}

// ── 아이소메트릭 기본 ──
// iso0: 원점 기준(평행이동 전) 좌표. 심볼은 iso0 로 그리고 <use x y> 로 옮긴다.
function iso0(x, y, z = 0) { return [r((x - y) * TW), r((x + y) * TH - z)] }
function pts(list) { return list.map(p => p.join(',')).join(' ') }
function poly(points, fill, extra = '') { return `<polygon points="${pts(points)}" fill="${fill}"${extra ? ` ${extra}` : ''}/>` }
// 원점 기준 상자: w×d 타일, 높이 h
function box0(w, d, h, top, left, right, extra = '') {
  const a = iso0(0, 0, h), b = iso0(w, 0, h), c = iso0(w, d, h), e = iso0(0, d, h)
  const c0 = iso0(w, d, 0), e0 = iso0(0, d, 0), b0 = iso0(w, 0, 0)
  return poly([e, c, c0, e0], left, extra) + poly([c, b, b0, c0], right, extra) + poly([a, b, c, e], top, extra)
}

// ── 심볼(한 번만 정의) ──
function symbols(s) {
  const out = []
  // 책상: 2×1 타일 + 모니터 + 머그컵 + 메모
  let desk = box0(2, 1, DESK_H, s.desk, s.deskFront, s.deskSide)
  const [sx, sy] = iso0(1, 0.27, DESK_H + 12)
  desk += `<rect x="${sx - 2}" y="${sy + 2}" width="4" height="8" fill="${s.monitor}"/><rect x="${sx - 13}" y="${sy - 11}" width="26" height="16" rx="2" fill="${s.monitor}"/><rect x="${sx - 11}" y="${sy - 9}" width="22" height="12" rx="1" fill="${s.screen}"${s.glow ? ' filter="url(#glow)"' : ''}/>`
  const [mx, my] = iso0(1.7, 0.6, DESK_H)
  desk += `<ellipse cx="${mx}" cy="${my}" rx="4" ry="2.2" fill="${s.accent}" opacity=".85"/>`
  const [px, py] = iso0(0.35, 0.65, DESK_H)
  desk += `<polygon points="${px - 9},${py} ${px},${py - 5} ${px + 9},${py} ${px},${py + 5}" fill="#fff" opacity=".9"/>`
  out.push(`<symbol id="d" overflow="visible">${desk}</symbol>`)
  // 의자
  out.push(`<symbol id="c" overflow="visible"><ellipse cx="0" cy="3" rx="12" ry="6" fill="${s.chair}" opacity=".9"/><ellipse cx="0" cy="-2" rx="14" ry="8" fill="${s.chair}"/></symbol>`)
  // 사람 몸통+머리: p(직원) · k(총괄) · g(채용 예정, 반투명 점선)
  const body = fill => `<path d="M-12,0 q0,-22 12,-22 q12,0 12,22 z" fill="${fill}"/><circle cx="0" cy="-32" r="12" fill="${s.skin}"/>`
  out.push(`<symbol id="p" overflow="visible">${body(s.chair)}</symbol>`)
  out.push(`<symbol id="k" overflow="visible">${body(s.accent)}</symbol>`)
  out.push(`<symbol id="g" overflow="visible" opacity=".55"><path d="M-12,0 q0,-22 12,-22 q12,0 12,22 z" fill="${s.ghost}" stroke="${s.muted}" stroke-dasharray="3 2"/><circle cx="0" cy="-32" r="12" fill="${s.ghost}" stroke="${s.muted}" stroke-dasharray="3 2"/></symbol>`)
  // 화분
  out.push(`<symbol id="t" overflow="visible"><ellipse cx="0" cy="0" rx="11" ry="5" fill="${s.pot}"/><rect x="-10" y="-16" width="20" height="16" fill="${s.pot}"/><circle cx="-9" cy="-28" r="11" fill="${s.plant}"/><circle cx="9" cy="-31" r="12" fill="${s.plant}" opacity=".9"/><circle cx="0" cy="-42" r="11" fill="${s.plant}" opacity=".95"/></symbol>`)
  const filters = s.glow
    ? `<filter id="glow" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="2.5" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>`
    : ''
  // 바닥 체크무늬 패턴(타일 2×2 가 한 칸)
  const pattern = `<pattern id="fl" width="${TW * 2}" height="${TH * 2}" patternUnits="userSpaceOnUse"><rect width="${TW * 2}" height="${TH * 2}" fill="${s.floorA}"/><polygon points="${TW},0 ${TW * 2},${TH} ${TW},${TH * 2} 0,${TH}" fill="${s.floorB}"/></pattern>`
  return `<defs>${filters}${pattern}${out.join('')}</defs>`
}

// ── 장면 좌표(평행이동 포함) ──
function makeIso(cols, rows) {
  const ox = rows * TW + 40
  const oy = WALL_H + 96
  const iso = (x, y, z = 0) => [r(ox + (x - y) * TW), r(oy + (x + y) * TH - z)]
  return { iso, ox, oy, width: (cols + rows) * TW + 80, height: (cols + rows) * TH + WALL_H + 150 }
}
function box(iso, x, y, w, d, h, top, left, right, extra = '') {
  const a = iso(x, y, h), b = iso(x + w, y, h), c = iso(x + w, y + d, h), e = iso(x, y + d, h)
  const c0 = iso(x + w, y + d, 0), e0 = iso(x, y + d, 0), b0 = iso(x + w, y, 0)
  return poly([e, c, c0, e0], left, extra) + poly([c, b, b0, c0], right, extra) + poly([a, b, c, e], top, extra)
}
function use(id, [x, y], extra = '') { return `<use href="#${id}" x="${x}" y="${y}"${extra}/>` }

function tag(ctx, x, y, lines, opts = {}) {
  const { iso, s } = ctx
  const [cx, cy] = iso(x, y, 0)
  const top = cy - 52 - (opts.lift || 0)
  const w = r(Math.max(64, ...lines.map(l => l.text.length * (l.size || 11) * 0.92 + 16)))
  const h = lines.length * 13 + 8
  let out = `<g${opts.attr ? ` ${opts.attr}` : ''}>`
  out += `<path d="M${cx - 4},${top + h} l4,5 l4,-5 z" fill="${s.tag}" stroke="${s.tagLine}"/>`
  out += `<rect x="${r(cx - w / 2)}" y="${top}" width="${w}" height="${h}" rx="7" fill="${s.tag}" stroke="${s.tagLine}"${opts.ghost ? ' stroke-dasharray="3 2"' : ''}/>`
  lines.forEach((l, i) => {
    out += `<text x="${cx}" y="${top + 15 + i * 13}" font-size="${l.size || 11}" font-weight="${l.bold ? 700 : 500}" fill="${l.muted ? s.muted : (l.accent ? s.accent : s.ink)}" text-anchor="middle"${l.attr ? ` ${l.attr}` : ''}>${esc(l.text)}</text>`
  })
  return out + '</g>'
}
function bubble(ctx, x, y, text, attr) {
  const { iso, s } = ctx
  const [cx0, cy] = iso(x, y, 0)
  const cx = cx0 + 34
  const w = r(Math.max(60, text.length * 11 + 20))
  const top = cy - 112
  return `<g ${attr}${text ? '' : ' visibility="hidden"'}><rect x="${r(cx - w / 2)}" y="${top}" width="${w}" height="22" rx="11" fill="${s.accent}" opacity=".95"/><path d="M${cx0 - 2},${top + 22} l6,6 l6,-6 z" fill="${s.accent}" opacity=".95"/><text x="${cx}" y="${top + 15}" font-size="11" font-weight="600" fill="#fff" text-anchor="middle" data-bubble-text="1">${esc(text)}</text></g>`
}
function sofa(ctx, x, y) {
  const { iso, s } = ctx
  return box(iso, x, y, 2, 1, 14, s.sofa, s.deskSide, s.deskFront) + box(iso, x, y, 2, 0.3, 30, s.deskFront, s.deskSide, s.deskSide)
}
function roundTable(ctx, x, y) {
  const { iso, s } = ctx
  const [cx, cy] = iso(x + 0.5, y + 0.5, 0)
  return `<ellipse cx="${cx}" cy="${cy}" rx="16" ry="8" fill="${s.deskSide}"/><rect x="${cx - 3}" y="${cy - 18}" width="6" height="18" fill="${s.deskSide}"/><ellipse cx="${cx}" cy="${cy - 18}" rx="22" ry="11" fill="${s.desk}" stroke="${s.deskSide}"/>`
}
function meetingTable(ctx, x, y) {
  const { iso, s } = ctx
  let out = ''
  for (let i = 0; i < 3; i++) out += use('c', iso(x + 0.5 + i, y - 0.45))
  out += box(iso, x, y, 3, 1.4, DESK_H, s.desk, s.deskFront, s.deskSide)
  for (let i = 0; i < 3; i++) out += use('c', iso(x + 0.5 + i, y + 1.95))
  return out
}
function whiteboard(ctx, x, y) {
  const { iso, s } = ctx
  let out = poly([iso(x, y, 78), iso(x + 2.4, y, 78), iso(x + 2.4, y, 22), iso(x, y, 22)], '#fff', `stroke="${s.wallEdge}"`)
  const notes = ['#ffd86b', '#9ad0f5', '#f9a8c9', '#b5e3a1']
  notes.forEach((n, i) => { const [nx, ny] = iso(x + 0.4 + i * 0.5, y, 62 - (i % 2) * 14); out += `<rect x="${nx - 5}" y="${ny - 5}" width="10" height="10" fill="${n}"/>` })
  return out
}
function bookshelf(ctx, x, y) {
  const { iso, s } = ctx
  let out = box(iso, x, y, 0.6, 2, 70, s.deskSide, s.deskFront, s.deskSide)
  const books = ['#c96a4a', '#4a7fc9', '#d6b24a', '#5f9e6a', '#8a62b8']
  for (let row = 0; row < 3; row++) for (let i = 0; i < 5; i++) {
    const [bx, by] = iso(x + 0.6, y + 0.2 + i * 0.35, 14 + row * 20)
    out += `<rect x="${bx - 1}" y="${by - 13}" width="5" height="13" fill="${books[(i + row) % 5]}"/>`
  }
  return out
}
function serverRack(ctx, x, y) {
  const { iso } = ctx
  let out = box(iso, x, y, 0.7, 1, 80, '#1b2434', '#0f1521', '#161e2d')
  for (let i = 0; i < 7; i++) { const [lx, ly] = iso(x + 0.7, y + 0.5, 12 + i * 10); out += `<circle cx="${lx + 4}" cy="${ly}" r="1.6" fill="${i % 2 ? '#5ef0c6' : '#f0a35e'}" filter="url(#glow)"/>` }
  return out
}
function coffee(ctx, x, y) {
  const { iso, s } = ctx
  let out = box(iso, x, y, 1, 0.6, 22, s.desk, s.deskFront, s.deskSide)
  out += box(iso, x + 0.3, y + 0.1, 0.35, 0.35, 36, '#5a6068', s.monitor, '#444a52')
  const [kx, ky] = iso(x + 0.8, y + 0.4, 22)
  return out + `<ellipse cx="${kx}" cy="${ky}" rx="4" ry="2.4" fill="${s.accent}"/>`
}
function rug(ctx, x, y, w, d) {
  const { iso, s } = ctx
  return poly([iso(x, y), iso(x + w, y), iso(x + w, y + d), iso(x, y + d)], s.rug, 'opacity=".9"')
}
function zoneLabel(ctx, x, y, text) {
  const { iso, s } = ctx
  const [cx, cy] = iso(x, y, 0)
  return `<text x="${cx}" y="${cy}" font-size="10" fill="${s.muted}" text-anchor="middle" letter-spacing="1">${esc(text)}</text>`
}

// ── 좌석 ──
// 포드 = 책상 4개(2열). 의자는 모두 책상 앞(보는 쪽)에 둬서 사람이 가려지지 않게 한다.
function podSeats(px, py) {
  return [
    { desk: [px, py], chair: [px + 1, py + 1.55] },
    { desk: [px + 2.4, py], chair: [px + 3.4, py + 1.55] },
    { desk: [px, py + 2.6], chair: [px + 1, py + 4.15] },
    { desk: [px + 2.4, py + 2.6], chair: [px + 3.4, py + 4.15] },
  ]
}
function layoutSeats(stage) {
  const seats = []
  for (const [px, py] of stage.pods) for (const s of podSeats(px, py)) seats.push(s)
  return seats
}
// 좌석 배정: 총괄 → 직원 → 채용 예정 → 빈 자리
function assignSeats(org, stage) {
  const seats = layoutSeats(stage)
  const coordinator = org.agents.find(a => a.coordinator)
  const queue = []
  if (coordinator) queue.push({ kind: 'agent', agent: coordinator })
  for (const a of org.agents) if (a !== coordinator) queue.push({ kind: 'agent', agent: a })
  for (const p of org.planned) queue.push({ kind: 'planned', planned: p })
  return seats.map((seat, i) => ({ seat, index: i, ...(queue[i] || { kind: 'empty' }) }))
}

function renderOffice(orgInput, options = {}) {
  const org = normalizeOrg(orgInput)
  const styleKey = STYLES[options.style] ? options.style : 'warm'
  const stageKey = STAGES[options.stage] ? options.stage : 'floor'
  const s = STYLES[styleKey]
  const stage = STAGES[stageKey]
  const { iso, ox, oy, width, height } = makeIso(stage.cols, stage.rows)
  const ctx = { iso, s }
  const items = []
  const push = (depth, svg) => items.push({ depth, svg })

  // 바닥: 체크무늬 패턴. 패턴 원점을 타일 격자(iso(0,0) 기준 가로 한 칸 왼쪽)에 맞춘다.
  const floorPoly = [iso(0, 0), iso(stage.cols, 0), iso(stage.cols, stage.rows), iso(0, stage.rows)]
  const floor = `<g transform="translate(${ox - TW},${oy})"><polygon points="${pts(floorPoly.map(([x, y]) => [x - (ox - TW), y - oy]))}" fill="url(#fl)"/></g>`
  // 벽 두 면 + 창문 + 시계
  const wallL = poly([iso(0, 0, WALL_H), iso(stage.cols, 0, WALL_H), iso(stage.cols, 0, 0), iso(0, 0, 0)], s.wall)
  const wallR = poly([iso(0, 0, WALL_H), iso(0, stage.rows, WALL_H), iso(0, stage.rows, 0), iso(0, 0, 0)], s.wallSide)
  let windows = ''
  const win = `stroke="${s.windowFrame}" stroke-width="1.5"`
  for (let i = 0; i < Math.floor(stage.cols / 3); i++) { const wx = 1.2 + i * 3; windows += poly([iso(wx, 0, 100), iso(wx + 1.8, 0, 100), iso(wx + 1.8, 0, 36), iso(wx, 0, 36)], s.window, win) }
  for (let i = 0; i < Math.floor(stage.rows / 3); i++) { const wy = 1.2 + i * 3; windows += poly([iso(0, wy, 100), iso(0, wy + 1.8, 100), iso(0, wy + 1.8, 36), iso(0, wy, 36)], s.window, win) }
  const [clx, cly] = iso(stage.cols - 1.2, 0, 80)
  const clock = `<circle cx="${clx}" cy="${cly}" r="9" fill="#fff" stroke="${s.wallEdge}"/><path d="M${clx},${cly} l0,-6 M${clx},${cly} l4,2" stroke="${s.ink}" stroke-width="1.5"/>`

  // 소품
  if (stage.shelf) push(stage.shelf[0] + stage.shelf[1] + 0.1, bookshelf(ctx, stage.shelf[0], stage.shelf[1]))
  if (stage.board) push(stage.board[0] + 0.05, whiteboard(ctx, stage.board[0], stage.board[1] + 0.2))
  if (stage.lounge) {
    const [lx, ly] = stage.lounge
    push(lx + ly - 0.5, rug(ctx, lx - 0.3, ly - 0.3, 3.2, 3.4))
    push(lx + ly + 2.2, sofa(ctx, lx, ly + 2))
    push(lx + ly + 1.2, roundTable(ctx, lx + 1.2, ly + 0.6))
    push(lx + ly + 0.4, coffee(ctx, lx + 1.8, ly - 0.2))
    push(lx + ly + 3.6, zoneLabel(ctx, lx + 1.4, ly + 3.9, '라운지'))
  }
  if (stage.meeting) {
    const [mx, my] = stage.meeting
    push(mx + my + 1.5, meetingTable(ctx, mx, my))
    push(mx + my + 3.6, zoneLabel(ctx, mx + 1.5, my + 3.4, '회의 테이블'))
  }
  for (const [px, py] of stage.plants) push(px + py + 1, use('t', iso(px + 0.5, py + 0.5)))
  if (s.glow && stageKey !== 'studio') push(stage.cols + 0.2, serverRack(ctx, stage.cols - 1.2, 0.2))

  // 책상·사람
  const seats = assignSeats(org, stage)
  const stats = { desks: seats.length, agents: 0, planned: 0, empty: 0 }
  for (const { seat, kind, agent, planned } of seats) {
    const [dx, dy] = seat.desk
    const [cx, cy] = seat.chair
    push(dx + dy + 1, use('d', iso(dx, dy)))
    push(cx + cy + 0.5, use('c', iso(cx, cy)))
    const [hx, hy] = iso(cx, cy)
    if (kind === 'agent') {
      stats.agents += 1
      const a = agent
      const status = a.status === 'working' ? '작업 중' : a.status === 'break' ? '휴식' : '대기'
      push(cx + cy + 0.6, use(a.coordinator ? 'k' : 'p', [hx, hy]) + `<text x="${hx}" y="${hy - 27}" font-size="14" text-anchor="middle">${esc(a.emoji)}</text>`)
      push(100 + cx + cy, tag(ctx, cx, cy, [
        { text: `${a.name}${a.role ? ' · ' + a.role : ''}`, bold: true, size: a.coordinator ? 12 : 11 },
        { text: `${status} · Lv.${a.level}`, muted: true, size: 10, attr: `data-status-for="${esc(a.id)}"` },
      ], { lift: 10, attr: `data-agent="${esc(a.id)}"` }))
      push(200 + cx + cy, bubble(ctx, cx, cy, a.bubble, `data-bubble-for="${esc(a.id)}"`))
    } else if (kind === 'planned') {
      stats.planned += 1
      push(cx + cy + 0.6, use('g', [hx, hy]) + `<text x="${hx}" y="${hy - 27}" font-size="14" text-anchor="middle" opacity=".7">${esc(planned.emoji)}</text>`)
      push(100 + cx + cy, tag(ctx, cx, cy, [
        { text: `채용 예정 · ${planned.title}`, bold: true, size: 11, accent: true },
        ...(planned.reason ? [{ text: planned.reason, muted: true, size: 9 }] : []),
      ], { ghost: true, lift: 10 }))
    } else {
      stats.empty += 1
      push(100 + cx + cy, tag(ctx, cx, cy, [{ text: '빈 자리', muted: true, size: 10 }], { ghost: true, lift: -6 }))
    }
  }
  if (stageKey === 'hq' && org.departments.length) {
    stage.pods.forEach(([px, py], i) => { if (org.departments[i]) push(px + py - 0.9, zoneLabel(ctx, px + 2, py - 1.2, org.departments[i])) })
  }

  items.sort((a, b) => a.depth - b.depth)
  const title = `${org.company}${org.owner ? ' · ' + org.owner : ''}`
  const sub = `${stage.label} · 직원 ${stats.agents}명 · 채용 예정 ${stats.planned} · 빈 자리 ${stats.empty}`
  const header = `<text x="28" y="36" font-size="20" font-weight="700" fill="${s.ink}">${esc(title)}</text><text x="28" y="58" font-size="12" fill="${s.muted}">${esc(sub)}</text>${org.tagline ? `<text x="28" y="78" font-size="12" fill="${s.accent}" font-weight="600">${esc(org.tagline)}</text>` : ''}`
  const svg = `<svg viewBox="0 0 ${width} ${height}" width="100%" role="img" aria-label="${esc(title)} 가상 오피스" font-family='${FONT}'${s.crisp ? ' shape-rendering="crispEdges"' : ''} style="display:block;background:${s.bg};border-radius:14px">${symbols(s)}${wallL}${wallR}${windows}${clock}${floor}${items.map(i => i.svg).join('')}${header}</svg>`
  return { svg, stats, style: styleKey, stage: stageKey, width, height }
}

// 대시보드 「나의 위젯」용 HTML. 외부 통신 없음. 앱이 주는 dashboard:data 로 작업 중/대기·말풍선·Lv 를 갱신한다.
function renderWidget(org, options = {}) {
  const { svg, stats } = renderOffice(org, options)
  const script = `addEventListener('message',function(e){var d=e.data;if(!d||d.type!=='dashboard:data')return;var r=d.data&&d.data.records||{};var open={},done={},first={};Object.keys(r).forEach(function(k){(r[k]||[]).forEach(function(x){var a=x.agent;if(!a)return;if(x.status==='done'){done[a]=(done[a]||0)+1}else{open[a]=(open[a]||0)+1;if(!first[a])first[a]=x.title||''}})});document.querySelectorAll('[data-status-for]').forEach(function(t){var id=t.getAttribute('data-status-for');var o=open[id]||0,n=done[id]||0;t.textContent=(o?'작업 중':'대기')+' · Lv.'+(1+Math.floor(n/3))});document.querySelectorAll('[data-bubble-for]').forEach(function(g){var id=g.getAttribute('data-bubble-for');var tx=first[id]||'';var t=g.querySelector('[data-bubble-text]');t.textContent=tx.length>18?tx.slice(0,17)+'…':tx;g.setAttribute('visibility',tx?'visible':'hidden')});fit()});function fit(){parent.postMessage({type:'dashboard:height',height:document.body.scrollHeight+8},'*')}parent.postMessage({type:'dashboard:ready'},'*');fit();addEventListener('resize',fit)`
  const html = `<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><style>html,body{margin:0;padding:0;background:transparent}svg{max-width:100%;height:auto}</style></head><body>${svg}<script>${script}<\/script></body></html>`
  return { html, stats }
}

// 독립 HTML(브라우저에서 바로 여는 한 장).
function renderStandalone(org, options = {}) {
  const { svg, stats, style, stage } = renderOffice(org, options)
  const s = STYLES[style]
  const html = `<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>${esc(normalizeOrg(org).company)} — 가상 오피스</title><style>body{margin:0;background:${s.bg};color:${s.ink};font-family:${FONT}}main{max-width:1200px;margin:0 auto;padding:24px 16px}p{font-size:13px;opacity:.75}</style></head><body><main>${svg}<p>${esc(STYLES[style].label)} · ${esc(STAGES[stage].label)} · 책상 ${stats.desks} · 직원 ${stats.agents} · 채용 예정 ${stats.planned} · 빈 자리 ${stats.empty}</p></main></body></html>`
  return { html, stats }
}

const org = {"company":"한이룸 AI 오피스","owner":"이룸","tagline":"강의는 사람이, 반복은 비서가","departments":["콘텐츠","제품·개발","운영·교육","신설 예정","신설 예정"],"agents":[{"id":"main","name":"지혜","emoji":"🌟","role":"총괄","coordinator":true,"status":"working","level":9,"bubble":"1주차 발표 자료 점검"},{"id":"yj-research-bot","name":"윤진","emoji":"📊","role":"리서치","status":"working","level":6,"bubble":"AI 뉴스 5건 선별"},{"id":"planning-bot","name":"수지","emoji":"👾","role":"소셜미디어","status":"idle","level":4},{"id":"writing-bot","name":"옥자","emoji":"🦊","role":"글쓰기","status":"working","level":8,"bubble":"뉴스레터 초안"},{"id":"coding-bot","name":"영미","emoji":"💻","role":"코딩","status":"idle","level":7},{"id":"design-bot","name":"하나","emoji":"🎨","role":"디자인","status":"idle","level":5},{"id":"qa-bot","name":"세라","emoji":"🔍","role":"QA","status":"working","level":3,"bubble":"가이드 링크 점검"},{"id":"ian-bot","name":"이안","emoji":"🪞","role":"회고","status":"break","level":2},{"id":"chunja-bot","name":"춘자","emoji":"🌱","role":"인턴","status":"idle","level":1},{"id":"jian-bot","name":"지안","emoji":"📘","role":"학습코치","status":"idle","level":4}],"planned":[{"title":"수강생 응대","reason":"업무 지도 · 카톡 문의 답변","emoji":"💬"},{"title":"영상 편집","reason":"업무 지도 · 강의 영상 컷 편집","emoji":"🎬"},{"title":"마케팅 성과","reason":"업무 지도 · 주간 지표 정리","emoji":"📈"},{"title":"쇼핑몰 운영","reason":"4주차 · 어사이드 주문 관리","emoji":"🛍️"},{"title":"재무·정산","reason":"업무 지도 · 월말 정산","emoji":"🧾"}]};
const state = { style: 'warm', stage: 'floor' };
try { const saved = JSON.parse(localStorage.getItem('vo-sample') || '{}'); if (STYLES[saved.style]) state.style = saved.style; if (STAGES[saved.stage]) state.stage = saved.stage } catch {}
function buttons(el, dict, key) {
  el.innerHTML = '';
  for (const [k, v] of Object.entries(dict)) {
    const b = document.createElement('button'); b.type = 'button'; b.className = 'opt'; b.setAttribute('aria-pressed', String(state[key] === k));
    b.innerHTML = '<span>' + v.label + '</span><small>' + v.desc + '</small>';
    b.addEventListener('click', () => { state[key] = k; try { localStorage.setItem('vo-sample', JSON.stringify(state)) } catch {} draw() });
    el.appendChild(b);
  }
}
function draw() {
  buttons(document.getElementById('styles'), STYLES, 'style');
  buttons(document.getElementById('stages'), STAGES, 'stage');
  const { svg, stats } = renderOffice(org, state);
  document.getElementById('stage').innerHTML = svg;
  document.getElementById('meta').innerHTML = '<span>책상 <b>' + stats.desks + '</b></span><span>직원 <b>' + stats.agents + '</b></span><span>채용 예정 <b>' + stats.planned + '</b></span><span>빈 자리 <b>' + stats.empty + '</b></span><span>스타일 <b>' + STYLES[state.style].label + '</b></span><span>단계 <b>' + STAGES[state.stage].label + '</b></span>';
}
draw();
</script>
